<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fundprint: a CASual look at your mutual fund statement</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A deeper look at your mutual fund investments. Free, open source, and nothing leaves your browser.">
  <!-- Preview card for links shared on social sites and chat apps. These tags are only read by the
       site that shows the link; this page never loads the image from another site. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Fundprint">
  <meta property="og:title" content="Fundprint: a CASual look at your mutual fund statement">
  <meta property="og:description" content="A deeper look at your mutual fund investments. Free, open source, and nothing leaves your browser.">
  <meta property="og:url" content="https://lab.shibaprasadb.com/fundprint/">
  <meta property="og:image" content="https://lab.shibaprasadb.com/fundprint/og-image.png">
  <meta property="og:image:width" content="2000">
  <meta property="og:image:height" content="1050">
  <meta property="og:image:alt" content="Fundprint: a deeper insight about your MF investments. Bar chart of returns by time held, compared with Nifty 50.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://lab.shibaprasadb.com/fundprint/og-image.png">
  <!-- The browser itself blocks any request to another site, even from a buggy dependency (rule P6).
       'unsafe-eval', 'wasm-unsafe-eval' and data: scripts are needed by Python-in-the-browser (its worker
       starts from a data: URL). What protects your file is connect-src: requests can only go to this site
       or to Umami, which counts anonymous visits. The counter script is a fixed copy kept in this repo
       (umami.js, loaded by feedback.js), so no script is loaded from another site. gateway.umami.is receives the counts. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' blob: data:; worker-src 'self' blob: data:; connect-src 'self' blob: data: https://gateway.umami.is; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <link rel="stylesheet" href="./vendor/stlite/stlite.css">
  <!-- So the app still works if the network drops after the page has loaded (spec 008) -->
  <!-- preload tags are added here by scripts/build_web.py -->
  <meta name="color-scheme" content="light">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="icon" href="./favicon.png" type="image/png" sizes="32x32">
  <style>
    /* Colours are the same ones as app/ui.py: paper #FAF8F3, ink #1B2333, navy #002147, grey #5F5F5F */
    body { margin: 0; background: #FAF8F3; }
    .serif { font-family: "Source Serif", "Source Serif 4", Georgia, serif; }

    /* The one slim navy bar: the only solid navy on the site. The app's own sidebar and toolbar are hidden. */
    #site-header { position: fixed; top: 0; left: 0; right: 0; height: 48px; z-index: 999990; box-sizing: border-box;
                   display: flex; align-items: center; justify-content: space-between; padding: 0 1.25rem;
                   background: #002147; color: #FFFFFF; font: 0.95rem system-ui, sans-serif; }
    #site-header a { color: #FFFFFF; text-decoration: none; }
    #site-header nav a:hover, #site-header nav a:focus-visible { text-decoration: underline; }
    #site-header .brand { display: flex; align-items: center; gap: 0.6rem; }
    #site-header .wordmark { font-size: 1.3rem; font-weight: 600; }
    #site-header .beta { padding: 0.05rem 0.4rem; border: 1px solid #FFFFFF; border-radius: 3px;
                         font-size: 0.7rem; font-variant-caps: all-small-caps; letter-spacing: 0.08em; }
    #site-header nav { display: flex; gap: 1.4rem; }
    #nav-toggle { position: absolute; opacity: 0; pointer-events: none; }
    #site-header .menu { display: none; cursor: pointer; min-height: 44px; align-items: center; padding: 0 0.25rem; }
    @media (max-width: 599px) {
      #site-header .menu { display: flex; }
      #site-header nav { display: none; position: absolute; top: 48px; left: 0; right: 0; flex-direction: column; gap: 0;
                         padding: 0 1.25rem 0.5rem; background: #002147; }
      #site-header nav a { display: flex; align-items: center; min-height: 44px; border-top: 1px solid rgba(255, 255, 255, 0.2); }
      #nav-toggle:checked ~ nav { display: flex; }
    }

    /* Full-page loading screen. boot.js removes it once the app has drawn itself. */
    #loading-note { position: fixed; inset: 0; z-index: 1000000; display: flex; flex-direction: column;
                    align-items: center; justify-content: center; gap: 1rem; padding: 2rem; box-sizing: border-box;
                    background: #FAF8F3; color: #1B2333; text-align: center; font: 1rem/1.5 system-ui, sans-serif; }
    #loading-note .wordmark { font-size: 2.25rem; font-weight: 600; color: #002147; }
    #loading-note p { margin: 0; max-width: 28rem; }
    #loading-note .line { width: 12rem; height: 2px; background: #D9D4C7; overflow: hidden; }
    #loading-note .line::after { content: ""; display: block; width: 40%; height: 100%; background: #002147;
                                 animation: loading-slide 1.4s ease-in-out infinite; }
    @keyframes loading-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #loading-note .line::after { animation: none; width: 100%; } }
    /* Shown by boot.js when start-up is slow or fails (spec 010) */
    #loading-note button { padding: 0.6rem 1.2rem; border: 1px solid #002147; border-radius: 4px; min-height: 44px;
                           background: #FAF8F3; color: #002147; font: 1rem system-ui, sans-serif; cursor: pointer; }
    #loading-note button:hover, #loading-note button:focus-visible { background: #F1EEE6; }
  </style>
  <!-- Umami Analytics: counts visits, nothing else. feedback.js sets up the filter first and then
       starts the Umami counter itself, so it can never run without the filter. -->
  <script defer src="./feedback.js"></script>
</head>
<body>
  <header id="site-header">
    <div class="brand"><a class="wordmark serif" href="./">Fundprint</a><span class="beta">Beta</span></div>
    <input type="checkbox" id="nav-toggle" aria-label="Menu">
    <label class="menu" for="nav-toggle">Menu</label>
    <nav>
      <a href="./" data-page="Home">Home</a>
      <a href="./Time_in_Market" data-page="Time in Market">Time in market</a>
      <a href="https://github.com/shibaprasadb/fundprint/blob/main/ARCHITECTURE.md" target="_blank" rel="noopener noreferrer">How it works</a>
      <a href="https://github.com/shibaprasadb/fundprint" target="_blank" rel="noopener noreferrer">Source</a>
      <a href="https://tally.so/r/2EqQGg" target="_blank" rel="noopener noreferrer">Feedback</a>
    </nav>
  </header>
  <div id="root"></div>
  <!-- Shown on top of the page until the app has drawn itself; boot.js removes it -->
  <div id="loading-note" role="status">
    <div class="wordmark serif">Fundprint</div>
    <p id="loading-text">Loading the analyser into your browser. This takes 5–10 seconds the first time, and it's why nothing is ever uploaded.</p>
    <div class="line" id="loading-line"></div>
  </div>
  <script type="module" src="./boot.js"></script>
</body>
</html>
