<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fundprint: a CASual look at your mutual fund statement</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Break your mutual fund returns down by how long you have held each purchase, and compare with the Nifty 50. Runs entirely in your browser.">
  <!-- The browser itself blocks any request to another site, even from a buggy dependency (rule P6).
       'unsafe-eval', 'wasm-unsafe-eval' and data: scripts are needed by Python-in-the-browser (its worker
       starts from a data: URL). What protects your file is connect-src: requests can only go to this site
       or to Umami, which counts anonymous visits. The counter script is a fixed copy kept in this repo
       (umami.js), so no script is loaded from another site. gateway.umami.is receives the counts. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' blob: data:; worker-src 'self' blob: data:; connect-src 'self' blob: data: https://gateway.umami.is; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <link rel="stylesheet" href="./vendor/stlite/stlite.css">
  <style>
    #loading-note { position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%); z-index: 1000000;
                    display: flex; align-items: center; gap: 0.75rem; max-width: calc(100vw - 2rem);
                    padding: 0.9rem 1.25rem; border-radius: 0.5rem; background: #FFFFFF; color: #31333F;
                    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15); font: 1rem system-ui, sans-serif; }
    #loading-note .spinner { flex: none; width: 1.1rem; height: 1.1rem; border-radius: 50%;
                             border: 2px solid #D5D6DB; border-top-color: #31333F;
                             animation: loading-spin 0.8s linear infinite; }
    @keyframes loading-spin { to { transform: rotate(360deg); } }
  </style>
  <!-- Umami Analytics: counts visits, nothing else -->
  <script defer src="./umami.js" data-website-id="2e67cd5c-f499-4fba-a139-481c5adb30c4" data-domains="lab.shibaprasadb.com"></script>
</head>
<body>
  <div id="root"></div>
  <!-- Shown on top of the page until the app has drawn itself; boot.js removes it -->
  <div id="loading-note" role="status">
    <span class="spinner"></span>
    <span>First time load takes 5-10 secs. Almost there…</span>
  </div>
  <script type="module" src="./boot.js"></script>
</body>
</html>
