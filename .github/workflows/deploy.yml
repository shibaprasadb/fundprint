name: deploy
# Builds the static site and pushes it into the separate `lab` repo (the only place the app is
# published). Never turn on GitHub Pages in THIS repo: see docs/specs/001-core.md section 3.
#
# Two jobs on purpose: `build` runs all the third-party Python (installs, tests, downloads) and never
# sees a secret. `deploy` holds the deploy key and runs no Python and no script from this repo.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [refresh-data]
    types: [completed]
permissions:
  contents: read
jobs:
  build:
    # Only main is ever published. A manual deploy started from any other branch does nothing.
    # A deploy started by the refresh only runs when that refresh succeeded, ran on main in this
    # repo, and was started by the schedule or by hand.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'schedule' ||
        github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    outputs:
      file_count: ${{ steps.count.outputs.file_count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements-ci.txt}
      - run: pip install --require-hashes -r requirements-ci.txt
      - run: pytest -q
      - run: python scripts/fetch_vendor.py
      - run: python scripts/build_web.py
      - name: Check the build has no outside links
        run: |
          ! grep -rEl "https?://(cdn|cloud\.umami|unpkg|fonts|www\.google|files\.pythonhosted|pypi)" dist/index.html dist/boot.js dist/app-manifest.json
      - name: Count the files in the build
        id: count
        run: echo "file_count=$(find dist -type f | wc -l)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with: {name: site, path: dist, retention-days: 1, if-no-files-found: error}
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'   # checked again here, next to the deploy key
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with: {name: site, path: dist}
      - name: Check no files were lost on the way
        run: |
          have=$(find dist -type f | wc -l)
          test "$have" = "${{ needs.build.outputs.file_count }}" || { echo "Expected ${{ needs.build.outputs.file_count }} files, found $have"; exit 1; }
          test -n "$(find dist/app -name '__init__.py' | head -1)"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: ${{ github.repository_owner }}/lab
          ssh-key: ${{ secrets.LAB_DEPLOY_KEY }}   # a deploy key limited to the lab repo
          path: lab
      - name: Copy the build into lab/fundprint
        run: |
          rm -rf lab/fundprint
          mkdir -p lab/fundprint
          cp -R dist/. lab/fundprint/
          # Without this, GitHub Pages hides files starting with "_" (like __init__.py) and the app can't load
          touch lab/.nojekyll
          cd lab
          git config user.name "fundprint-deploy"
          git config user.email "deploy@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Deploy fundprint ${GITHUB_SHA::7}" && git push)
