name: deploy
# Builds the static site and pushes it into the separate `lab` repo (the only place the app is
# published). Never turn on GitHub Pages in THIS repo: see SPEC.md section 3.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [refresh-data]
    types: [completed]
permissions:
  contents: read
jobs:
  deploy:
    # A deploy started by the refresh only runs when that refresh succeeded, ran on main in this
    # repo, and was started by the schedule or by hand. Pushes and manual deploys run as before.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'schedule' ||
        github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: python scripts/fetch_vendor.py
      - run: python scripts/build_web.py
      - name: Check the build has no outside links
        run: |
          ! grep -rEl "https?://(cdn|unpkg|fonts|www\.google|files\.pythonhosted|pypi)" dist/index.html dist/boot.js dist/app-manifest.json
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/lab
          ssh-key: ${{ secrets.LAB_DEPLOY_KEY }}   # a deploy key limited to the lab repo
          path: lab
      - name: Copy the build into lab/fundprint
        run: |
          rm -rf lab/fundprint
          mkdir -p lab/fundprint
          cp -R dist/. lab/fundprint/
          # Without this, GitHub Pages hides files starting with "_" (like __init__.py) and the app can't load
          touch lab/.nojekyll
          cd lab
          git config user.name "fundprint-deploy"
          git config user.email "deploy@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Deploy fundprint ${GITHUB_SHA::7}" && git push)
