name: refresh-data
on:
  schedule: [{cron: "30 2 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements-ci.txt}
      - run: pip install --require-hashes -r requirements-ci.txt
      - run: python scripts/refresh_data.py   # fails loudly and keeps old files if data looks wrong
      - run: |
          git config user.name "fundprint-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Refresh public data" && git push
