name: refresh-data
on:
  schedule: [{cron: "30 2 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: python scripts/refresh_data.py   # fails loudly and keeps old files if data looks wrong
      - run: |
          git config user.name "fundprint-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Refresh public data" && git push
